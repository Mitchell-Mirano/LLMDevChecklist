# 🛠️ Checklist Configuration (checklist.toml)

[checklist]
use_gitignore = true
target_dirs = ["backend", "frontend/src", "scripts"]
exclude_dirs = [".git", ".venv", "venv", "node_modules", "dist", "site", "__pycache__", "mongo-data"]
exclude_files = ["vite.config.js"]

[checklist.auto_fixers]
py_imports = true
vue_imports = true

[checklist.auditors]
language = true
hardcoded = true
docs = true
design = true

[checklist.language]
strict_english = true
custom_allowed_words = ["gptw", "nps", "rut"]

[checklist.hardcoded]
allow_localhost = true

[checklist.design]
tokens_files = []
extensions = [".vue", ".css", ".scss", ".tsx", ".jsx", ".svelte", ".html"]
min_contrast_aa = 4.5
max_z_index = 100
icon_library = ""
