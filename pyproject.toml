[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-dev-checklist"
version = "1.2.0"
description = "Modular Code Quality Audit & Checklist Suite for AI/LLM-generated code, Python, Vue.js, and LaTeX Thesis Projects"
readme = "README.md"
authors = [
    { name = "Merickson Projects Team" }
]
requires-python = ">=3.9"
dependencies = [
    'tomli; python_version < "3.11"',
]

[project.scripts]
checklist = "checklist.cli:main"
llm-dev-checklist = "checklist.cli:main"
thesis-checker = "thesis_checker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["checklist", "thesis_checker"]

[project.urls]
Homepage = "https://github.com/mitchellmirano/LLMDevChecklist"
Repository = "https://github.com/mitchellmirano/LLMDevChecklist.git"
